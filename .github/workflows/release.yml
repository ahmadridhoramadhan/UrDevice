name: Release

# Builds unsigned test packages for every platform. A pushed `v*` tag also
# publishes them to a GitHub Release. A manual run only uploads workflow artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows x86_64 (zip + msi)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release --locked -p urdevice-desktop

      - name: Work out the package version
        id: ver
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          if ($ref -match '^v(\d+\.\d+\.\d+)') { $v = $Matches[1] } else { $v = '0.1.0' }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target\release\urdevice.exe, LICENSE -DestinationPath dist\urdevice-windows-x86_64.zip

      - name: Build the MSI (WiX, with the Private-network firewall rule)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Firewall.wixext/5.0.2
          wix build -arch x64 -ext WixToolset.Firewall.wixext `
            -d Version=${{ steps.ver.outputs.version }} -d BinDir=target\release `
            packaging\windows\urdevice.wxs -o dist\urdevice-windows-x86_64.msi

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux x86_64 (deb + AppImage + tar.gz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build libraries
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libfontconfig1-dev libdbus-1-dev pkg-config

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - run: cargo build --release --locked -p urdevice-desktop

      - name: Debian package
        run: |
          mkdir -p dist
          cargo deb -p urdevice-desktop --no-build -o dist/urdevice-linux-amd64.deb

      - name: tar.gz
        run: |
          mkdir -p stage/urdevice
          cp target/release/urdevice LICENSE stage/urdevice/
          tar -C stage -czf dist/urdevice-linux-x86_64.tar.gz urdevice

      # The AppImage uses the host's libfontconfig and libdbus (no bundled libraries).
      # If this step fails, the .deb and .tar.gz above are still published.
      - name: AppImage
        continue-on-error: true
        run: |
          mkdir -p AppDir/usr/bin
          cp target/release/urdevice AppDir/usr/bin/urdevice
          cp packaging/linux/urdevice.desktop AppDir/urdevice.desktop
          cp assets/urdevice-icon-512.png AppDir/urdevice.png
          ln -s usr/bin/urdevice AppDir/AppRun
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir dist/urdevice-linux-x86_64.AppImage

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }} (dmg)
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain and target
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: cargo build --release --locked -p urdevice-desktop --target ${{ matrix.target }}

      - name: Build the .app and .dmg (unsigned, ad-hoc signature only)
        run: |
          VERSION=$(echo "${{ github.ref_name }}" | sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          case "$VERSION" in [0-9]*.[0-9]*.[0-9]*) ;; *) VERSION=0.1.0 ;; esac
          APP="stage/UrDevice.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" dist
          cp "target/${{ matrix.target }}/release/urdevice" "$APP/Contents/MacOS/urdevice"
          sed "s/@VERSION@/$VERSION/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          mkdir urdevice.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/urdevice-icon-1024.png --out "urdevice.iconset/icon_${s}x${s}.png" >/dev/null
            sips -z $((s*2)) $((s*2)) assets/urdevice-icon-1024.png --out "urdevice.iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns urdevice.iconset -o "$APP/Contents/Resources/urdevice.icns"
          codesign --force --deep --sign - "$APP"
          ln -s /Applications stage/Applications
          hdiutil create -volname UrDevice -srcfolder stage -ov -format UDZO "dist/urdevice-macos-${{ matrix.arch }}.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  android:
    name: Android release APK (debug-signed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;27.0.12077973"

      - name: Install the pinned Rust toolchain and Android targets
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - uses: gradle/actions/setup-gradle@v6

      - name: Build release APK (arm64-v8a, armeabi-v7a, x86_64)
        working-directory: android
        run: ./gradlew assembleRelease --console=plain

      # No release keystore exists. A throwaway debug keystore is created on this runner
      # and never stored, so the APK is a test build.
      - name: Align and sign with a debug keystore
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p dist
          keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/debug.keystore" --ks-pass pass:android --key-pass pass:android \
            --ks-key-alias androiddebugkey --out dist/urdevice-android.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify dist/urdevice-android.apk

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/urdevice-android.apk
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [windows, linux, macos, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l dist
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "UrDevice ${{ github.ref_name }} (unsigned test build)" \
            --notes-file .github/release-notes.md \
            --prerelease
