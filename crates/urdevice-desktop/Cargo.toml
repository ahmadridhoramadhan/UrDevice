[package]
name = "urdevice-desktop"
description = "UrDevice desktop app (Slint) for Windows, Linux, and macOS."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "urdevice"
path = "src/main.rs"

[dependencies]
auto-launch.workspace = true
jiff.workspace = true
directories.workspace = true
nokhwa.workspace = true
png.workspace = true
rqrr.workspace = true
zune-jpeg.workspace = true
tracing.workspace = true
slint = { workspace = true, features = ["unstable-winit-030"] }
rfd.workspace = true
urdevice-core = { workspace = true, features = ["mdns"] }
urdevice-media.workspace = true
urdevice-platform.workspace = true
urdevice-proto.workspace = true

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon.workspace = true

# Linux uses the StatusNotifierItem D-Bus protocol directly, so no GTK is needed.
[target.'cfg(target_os = "linux")'.dependencies]
ksni.workspace = true

[build-dependencies]
slint-build.workspace = true

[lints]
workspace = true

# Debian package, built with `cargo deb -p urdevice-desktop` (see .github/workflows/release.yml).
[package.metadata.deb]
name = "urdevice"
maintainer = "UrDevice contributors <noreply@users.noreply.github.com>"
section = "utils"
priority = "optional"
depends = "$auto"
extended-description = "Pair your phone and computers and share the clipboard, files, screen and input over your local network."
assets = [
    ["target/release/urdevice", "usr/bin/urdevice", "755"],
    ["../../packaging/linux/urdevice.desktop", "usr/share/applications/urdevice.desktop", "644"],
    ["../../assets/urdevice-icon-512.png", "usr/share/icons/hicolor/512x512/apps/urdevice.png", "644"],
    ["../../LICENSE", "usr/share/doc/urdevice/copyright", "644"],
]

# RPM package for Fedora, built with `cargo generate-rpm -p crates/urdevice-desktop` (see .github/workflows/release.yml).
[package.metadata.generate-rpm]
name = "urdevice"
summary = "Pair your phone and computers and share the clipboard, files, screen and input over your local network."
assets = [
    { source = "target/release/urdevice", dest = "/usr/bin/urdevice", mode = "755" },
    { source = "../../packaging/linux/urdevice.desktop", dest = "/usr/share/applications/urdevice.desktop", mode = "644" },
    { source = "../../assets/urdevice-icon-512.png", dest = "/usr/share/icons/hicolor/512x512/apps/urdevice.png", mode = "644" },
    { source = "../../LICENSE", dest = "/usr/share/doc/urdevice/LICENSE", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
fontconfig = "*"
dbus-libs = "*"

