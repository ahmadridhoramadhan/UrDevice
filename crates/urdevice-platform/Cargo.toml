[package]
name = "urdevice-platform"
description = "Desktop adapters (Windows, Linux, macOS) for the UrDevice core platform traits."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
directories.workspace = true
futures-core.workspace = true
gethostname.workspace = true
png.workspace = true
ring.workspace = true
starship-battery.workspace = true
tracing.workspace = true
urdevice-core.workspace = true
urdevice-proto.workspace = true
zune-jpeg.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["async-secret-service", "tokio", "crypto-rust"] }
x11rb = { workspace = true, features = ["randr"] }
zbus.workspace = true
# Screen sharing (#21): the ScreenCast portal and libpipewire at run time.
ashpd.workspace = true
futures-util.workspace = true
libloading.workspace = true
tokio.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation = { workspace = true, features = ["NSError"] }
# Screen sharing (#21): ScreenCaptureKit.
block2.workspace = true
dispatch2.workspace = true
objc2-core-graphics.workspace = true
objc2-core-media.workspace = true
objc2-core-video.workspace = true
objc2-screen-capture-kit.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }
clipboard-win.workspace = true
windows = { workspace = true, features = [
    "Foundation",
    "Foundation_Collections",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[lints]
workspace = true
