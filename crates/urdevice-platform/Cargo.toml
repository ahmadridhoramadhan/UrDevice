[package]
name = "urdevice-platform"
description = "Desktop adapters (Windows, Linux, macOS) for the UrDevice core platform traits."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
directories.workspace = true
futures-core.workspace = true
gethostname.workspace = true
png.workspace = true
ring.workspace = true
starship-battery.workspace = true
tracing.workspace = true
urdevice-core.workspace = true
urdevice-proto.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["async-secret-service", "tokio", "crypto-rust"] }
x11rb.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }
clipboard-win.workspace = true

[lints]
workspace = true
