[package]
name = "urdevice-platform"
description = "Desktop adapters (Windows, Linux, macOS) for the UrDevice core platform traits."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
directories.workspace = true
futures-core.workspace = true
gethostname.workspace = true
ring.workspace = true
starship-battery.workspace = true
tracing.workspace = true
urdevice-core.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["async-secret-service", "tokio", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

[lints]
workspace = true
