[workspace]
resolver = "3"
members = [
    "crates/urdevice-proto",
    "crates/urdevice-core",
    "crates/urdevice-platform",
    "crates/urdevice-media",
    "crates/urdevice-ffi",
    "crates/urdevice-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"
repository = "https://github.com/ahmadridhoramadhan/UrDevice"
publish = false

[workspace.dependencies]
# Internal crates
urdevice-core = { path = "crates/urdevice-core", default-features = false }
urdevice-media = { path = "crates/urdevice-media" }
urdevice-platform = { path = "crates/urdevice-platform" }
urdevice-proto = { path = "crates/urdevice-proto" }

# Shared third-party crates
bytes = "1"
futures-core = "0.3"
thiserror = "2"
prost = { version = "0.14", default-features = false, features = ["std", "derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["std", "ring"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
ring = "0.17"
rusqlite = { version = "0.43", features = ["bundled"] }
mdns-sd = { version = "0.19", default-features = false }
socket2 = { version = "0.6", features = ["all"] }
if-addrs = "0.15"
qrcode = { version = "0.14", default-features = false }
data-encoding = "2"
tracing = "0.1"
keyring = { version = "3", default-features = false }
starship-battery = "0.12"
gethostname = "1"
directories = "6"
jiff = "0.2"
auto-launch = "0.6"
nokhwa = { version = "0.10", default-features = false, features = ["input-native"] }
rqrr = "0.10"
# Pure-Rust MJPEG decoding for webcams without uncompressed formats (#47).
# Already in the tree through Slint's image loading.
zune-jpeg = "0.5"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "env-filter", "ansi"] }

# Desktop UI
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "accessibility",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
] }
slint-build = "1.18"
png = "0.18"
tray-icon = "0.26"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }

# Android bindings
uniffi = "0.32"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
